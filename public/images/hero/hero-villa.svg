<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2118"/>
      <stop offset="40%" stop-color="#5C3626"/>
      <stop offset="70%" stop-color="#9C5237"/>
      <stop offset="100%" stop-color="#E28D58"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2593F"/>
      <stop offset="50%" stop-color="#9E4028"/>
      <stop offset="100%" stop-color="#732B1A"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6DEC9"/>
      <stop offset="100%" stop-color="#B8AE99"/>
    </linearGradient>
    <linearGradient id="teakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54311C"/>
      <stop offset="100%" stop-color="#331D10"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFBD59" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="jaliHero" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#8F3722"/>
      <circle cx="12" cy="12" r="5" fill="#FFE8B5" opacity="0.8"/>
      <circle cx="0" cy="0" r="4" fill="#2D2118" opacity="0.4"/>
      <circle cx="24" cy="0" r="4" fill="#2D2118" opacity="0.4"/>
      <circle cx="0" cy="24" r="4" fill="#2D2118" opacity="0.4"/>
      <circle cx="24" cy="24" r="4" fill="#2D2118" opacity="0.4"/>
    </pattern>
    <pattern id="brickPattern" width="36" height="18" patternUnits="userSpaceOnUse">
      <rect width="36" height="18" fill="#B34B32"/>
      <line x1="0" y1="9" x2="36" y2="9" stroke="#7A2D1B" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="36" y2="18" stroke="#7A2D1B" stroke-width="1.5"/>
      <line x1="18" y1="0" x2="18" y2="9" stroke="#7A2D1B" stroke-width="1.5"/>
      <line x1="0" y1="9" x2="0" y2="18" stroke="#7A2D1B" stroke-width="1.5"/>
      <line x1="36" y1="9" x2="36" y2="18" stroke="#7A2D1B" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Twilight Indian Sky -->
  <rect width="1600" height="1000" fill="url(#skyGrad)"/>

  <!-- Warm Evening Sun / Horizon Glow -->
  <circle cx="950" cy="620" r="180" fill="#FFC371" opacity="0.35" filter="url(#glow)"/>

  <!-- Distant Tropical Trees (Neem, Palm Silhouettes) -->
  <path d="M 0 720 Q 150 680 300 710 T 650 690 T 1100 700 T 1600 680 L 1600 1000 L 0 1000 Z" fill="#1C140F" opacity="0.8"/>
  <!-- Palm Silhouettes -->
  <path d="M 120 710 Q 135 600 145 520 Q 150 515 155 520 L 140 710 Z" fill="#160F0B"/>
  <path d="M 145 520 Q 80 480 30 500 M 145 520 Q 100 450 70 420 M 145 520 Q 145 430 150 390 M 145 520 Q 190 440 220 420 M 145 520 Q 210 490 260 510" stroke="#160F0B" stroke-width="4" fill="none"/>

  <path d="M 1480 730 Q 1460 590 1440 480 Q 1435 475 1430 480 L 1460 730 Z" fill="#160F0B"/>
  <path d="M 1440 480 Q 1380 440 1330 460 M 1440 480 Q 1400 410 1370 380 M 1440 480 Q 1440 390 1445 350 M 1440 480 Q 1485 400 1520 380 M 1440 480 Q 1505 450 1560 470" stroke="#160F0B" stroke-width="4" fill="none"/>

  <!-- Plinth & Stone Terrace -->
  <polygon points="120,860 1480,860 1580,980 20,980" fill="url(#stoneGrad)"/>
  <line x1="20" y1="980" x2="1580" y2="980" stroke="#756A55" stroke-width="3"/>
  <line x1="120" y1="860" x2="1480" y2="860" stroke="#8A7E68" stroke-width="2"/>

  <!-- Main Residence Wings -->
  <!-- Left Wing (Exposed Brick & Jali Screen) -->
  <rect x="220" y="440" width="380" height="420" fill="url(#brickPattern)"/>
  <!-- Jali Screen Inset on Upper Level -->
  <rect x="260" y="470" width="160" height="180" fill="url(#jaliHero)"/>
  <rect x="260" y="470" width="160" height="180" fill="none" stroke="#542315" stroke-width="5"/>
  <!-- Warm Internal Light pouring through Jali -->
  <rect x="265" y="475" width="150" height="170" fill="url(#warmLight)" opacity="0.4" style="mix-blend-mode: screen;"/>

  <!-- Cantilevered Upper Terrace with Teak Louvers -->
  <rect x="460" y="360" width="440" height="240" fill="#241B15"/>
  <!-- Teak Louver Blades -->
  <g stroke="#8F562E" stroke-width="5">
    <line x1="480" y1="380" x2="480" y2="580"/>
    <line x1="510" y1="380" x2="510" y2="580"/>
    <line x1="540" y1="380" x2="540" y2="580"/>
    <line x1="570" y1="380" x2="570" y2="580"/>
    <line x1="600" y1="380" x2="600" y2="580"/>
    <line x1="630" y1="380" x2="630" y2="580"/>
  </g>

  <!-- Central Courtyard / Glazed Living Atrium -->
  <rect x="660" y="480" width="420" height="380" fill="#1C1814"/>
  <!-- Large Glass Portal with Warm Interior Living Glow -->
  <rect x="690" y="520" width="360" height="340" fill="url(#warmLight)"/>
  <!-- Interior Pillars & Chandelier silhouette -->
  <rect x="750" y="520" width="16" height="340" fill="#422513"/>
  <rect x="970" y="520" width="16" height="340" fill="#422513"/>
  <circle cx="865" cy="580" r="28" fill="#FFC837" filter="url(#glow)"/>
  <!-- Slender Window Frames -->
  <g stroke="#1F1A15" stroke-width="3" fill="none">
    <rect x="690" y="520" width="360" height="340"/>
    <line x1="810" y1="520" x2="810" y2="860"/>
    <line x1="930" y1="520" x2="930" y2="860"/>
    <line x1="690" y1="680" x2="1050" y2="680"/>
  </g>

  <!-- Right Wing (Traditional Kerala Sloped Gable Roof with Mangalore Tiles) -->
  <polygon points="1060,420 1420,420 1240,260" fill="#A8432A"/>
  <!-- Clay tile ridges -->
  <g stroke="#662211" stroke-width="2">
    <line x1="1240" y1="260" x2="1080" y2="420"/>
    <line x1="1240" y1="260" x2="1120" y2="420"/>
    <line x1="1240" y1="260" x2="1160" y2="420"/>
    <line x1="1240" y1="260" x2="1200" y2="420"/>
    <line x1="1240" y1="260" x2="1240" y2="420"/>
    <line x1="1240" y1="260" x2="1280" y2="420"/>
    <line x1="1240" y1="260" x2="1320" y2="420"/>
    <line x1="1240" y1="260" x2="1360" y2="420"/>
    <line x1="1240" y1="260" x2="1400" y2="420"/>
  </g>
  <!-- Timber Carved Facia & Gables -->
  <polygon points="1235,270 1245,270 1240,290" fill="#FFE8B5"/>
  <rect x="1080" y="420" width="320" height="440" fill="url(#stoneGrad)"/>
  <!-- Verandah with Classical Turned Timber Columns -->
  <rect x="1100" y="600" width="280" height="260" fill="#201A15"/>
  <rect x="1130" y="600" width="14" height="260" fill="url(#teakGrad)"/>
  <rect x="1230" y="600" width="14" height="260" fill="url(#teakGrad)"/>
  <rect x="1330" y="600" width="14" height="260" fill="url(#teakGrad)"/>
  <!-- Verandah Thinnai Bench -->
  <rect x="1110" y="780" width="260" height="35" fill="#452715"/>

  <!-- Water Reflection / Stepped Pool in Foreground -->
  <polygon points="400,900 1200,900 1280,1000 320,1000" fill="#181F26" opacity="0.85"/>
  <!-- Golden Water Ripples -->
  <path d="M 450 930 Q 600 920 750 930 T 1150 925" stroke="#FFA751" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 380 960 Q 550 950 820 960 T 1220 955" stroke="#FFA751" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 340 985 Q 520 975 880 985 T 1260 980" stroke="#FF8008" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Brass Urli with Floating Marigolds at Entrance -->
  <ellipse cx="640" cy="875" rx="35" ry="14" fill="#D4AF37"/>
  <circle cx="630" cy="873" r="4" fill="#FF9900"/>
  <circle cx="642" cy="871" r="4" fill="#FFCC00"/>
  <circle cx="652" cy="874" r="4" fill="#FF5500"/>
  <circle cx="640" cy="876" r="4" fill="#FF9900"/>

  <!-- Architectural Watermark Overlay -->
  <text x="1420" y="940" fill="#8C806F" font-family="serif" font-size="16" letter-spacing="3" text-anchor="end">STHAPATI HOMES ARCHITECTURE</text>
</svg>
