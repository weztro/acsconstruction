<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="warmSiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A281E"/>
      <stop offset="50%" stop-color="#6E4430"/>
      <stop offset="100%" stop-color="#A86A4C"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFA000" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5524"/>
      <stop offset="50%" stop-color="#733F19"/>
      <stop offset="100%" stop-color="#542B0D"/>
    </linearGradient>
    <linearGradient id="brickColor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2593F"/>
      <stop offset="100%" stop-color="#9C3A24"/>
    </linearGradient>
  </defs>

  <!-- Site Background: Warm Sunlight through Unfinished Architecture -->
  <rect width="1200" height="900" fill="url(#warmSiteGrad)"/>

  <!-- Morning Sunlight Beams pouring into the site -->
  <polygon points="150,0 450,0 850,900 350,900" fill="url(#sunbeam)"/>
  <polygon points="500,0 750,0 1150,900 800,900" fill="url(#sunbeam)"/>

  <!-- Exposed RCC Pillars & Wooden Formwork in Background -->
  <rect x="120" y="80" width="90" height="820" fill="#42352B"/>
  <rect x="980" y="60" width="110" height="840" fill="#42352B"/>
  <!-- Rebar Steel Rods extending from columns -->
  <g stroke="#261E18" stroke-width="4">
    <line x1="140" y1="20" x2="140" y2="120"/>
    <line x1="160" y1="10" x2="160" y2="120"/>
    <line x1="180" y1="25" x2="180" y2="120"/>
    <line x1="1010" y1="15" x2="1010" y2="100"/>
    <line x1="1040" y1="5" x2="1040" y2="100"/>
    <line x1="1065" y1="20" x2="1065" y2="100"/>
  </g>

  <!-- Solid Wire-Cut Brick Wall Under Construction (Being Placed) -->
  <g transform="translate(180, 480)">
    <!-- Completed rows -->
    <rect x="0" y="180" width="800" height="40" fill="#A8432A" stroke="#4A1E14" stroke-width="2"/>
    <rect x="20" y="140" width="760" height="40" fill="#B34B32" stroke="#4A1E14" stroke-width="2"/>
    <rect x="0" y="100" width="780" height="40" fill="#993822" stroke="#4A1E14" stroke-width="2"/>
    <rect x="30" y="60" width="730" height="40" fill="#B84D34" stroke="#4A1E14" stroke-width="2"/>
    <rect x="0" y="20" width="550" height="40" fill="#C2593F" stroke="#4A1E14" stroke-width="2"/>

    <!-- Brick Mortar lines -->
    <line x1="0" y1="180" x2="800" y2="180" stroke="#E3DBD2" stroke-width="3"/>
    <line x1="20" y1="140" x2="780" y2="140" stroke="#E3DBD2" stroke-width="3"/>
    <line x1="0" y1="100" x2="780" y2="100" stroke="#E3DBD2" stroke-width="3"/>
    <line x1="30" y1="60" x2="760" y2="60" stroke="#E3DBD2" stroke-width="3"/>
    <line x1="0" y1="20" x2="550" y2="20" stroke="#E3DBD2" stroke-width="3"/>

    <!-- Individual Brick Joints -->
    <line x1="120" y1="180" x2="120" y2="220" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="240" y1="180" x2="240" y2="220" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="360" y1="180" x2="360" y2="220" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="480" y1="180" x2="480" y2="220" stroke="#E3DBD2" stroke-width="2.5"/>

    <line x1="70" y1="140" x2="70" y2="180" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="190" y1="140" x2="190" y2="180" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="310" y1="140" x2="310" y2="180" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="430" y1="140" x2="430" y2="180" stroke="#E3DBD2" stroke-width="2.5"/>

    <line x1="140" y1="100" x2="140" y2="140" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="260" y1="100" x2="260" y2="140" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="380" y1="100" x2="380" y2="140" stroke="#E3DBD2" stroke-width="2.5"/>
    <line x1="500" y1="100" x2="500" y2="140" stroke="#E3DBD2" stroke-width="2.5"/>
  </g>

  <!-- Craftsman / Mason Figure (Focusing Intently on Precision Leveling) -->
  <g id="craftsman">
    <!-- Legs & Khaki Work Trousers -->
    <path d="M 680 580 L 620 780 L 640 890 L 700 890 L 710 740 L 760 890 L 820 890 L 790 730 L 760 580 Z" fill="#6E624F"/>

    <!-- Work Boots -->
    <rect x="625" y="870" width="85" height="30" rx="6" fill="#2E2319"/>
    <rect x="755" y="870" width="85" height="30" rx="6" fill="#2E2319"/>

    <!-- Torso: Cotton Earth-tone Work Shirt -->
    <path d="M 620 380 Q 700 360 760 380 L 780 590 L 610 590 Z" fill="#C98B58"/>
    <!-- Safety Vest Over Shirt -->
    <path d="M 615 400 L 670 410 L 675 580 L 610 580 Z" fill="#D97706"/>
    <path d="M 765 400 L 710 410 L 705 580 L 775 580 Z" fill="#D97706"/>
    <!-- Reflective Stripes -->
    <rect x="620" y="470" width="50" height="12" fill="#FEF08A"/>
    <rect x="710" y="470" width="55" height="12" fill="#FEF08A"/>

    <!-- Neck & Head with Safety Helmet & Gamcha Cloth -->
    <rect x="665" y="325" width="40" height="50" fill="url(#skinGrad)"/>
    <!-- Head (Side Profile, Leaning Forward Checking Spirit Level) -->
    <ellipse cx="685" cy="300" rx="42" ry="48" fill="url(#skinGrad)"/>
    <!-- Gamcha (Cotton cloth tied around forehead/neck) -->
    <path d="M 645 285 Q 685 270 725 295 L 720 320 Q 680 300 645 315 Z" fill="#B91C1C"/>
    <!-- Safety Hard Hat (Yellow with Sthapati Crest) -->
    <path d="M 635 275 Q 685 210 735 275 Q 755 280 740 288 L 625 288 Q 620 280 635 275 Z" fill="#FBBF24"/>
    <polygon points="615,285 750,285 745,292 618,292" fill="#D97706"/>

    <!-- Left Arm & Hand Holding Mason's Trowel -->
    <path d="M 620 395 Q 560 440 540 480 L 580 500 Q 610 450 645 420 Z" fill="#C98B58"/>
    <ellipse cx="535" cy="485" rx="16" ry="14" fill="url(#skinGrad)"/>
    <!-- Steel Pointing Trowel -->
    <polygon points="525,485 450,470 485,505" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="525" y="480" width="22" height="10" rx="3" fill="#4B2C1B"/>

    <!-- Right Arm Holding High-Precision Spirit Level -->
    <path d="M 750 400 Q 770 460 740 505 L 705 490 Q 730 450 720 415 Z" fill="#C98B58"/>
    <ellipse cx="735" cy="510" rx="16" ry="14" fill="url(#skinGrad)"/>
    <!-- 24-inch Yellow Aluminium Spirit Level on top of brick course -->
    <rect x="530" y="488" width="310" height="22" rx="3" fill="#EAB308" stroke="#713F12" stroke-width="1.5"/>
    <rect x="670" y="492" width="30" height="12" rx="2" fill="#1E293B"/>
    <!-- Bubble indicator vial -->
    <ellipse cx="685" cy="498" rx="8" ry="4" fill="#84CC16"/>
    <circle cx="685" cy="498" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Wooden Scaffolding Poles & Brass Plumb Line -->
  <g stroke="#78350F" stroke-width="14">
    <line x1="80" y1="20" x2="80" y2="880"/>
    <line x1="20" y1="360" x2="400" y2="360"/>
  </g>
  <!-- Brass Plumb Bob (Sahool) Hanging true -->
  <line x1="380" y1="360" x2="380" y2="620" stroke="#FFE082" stroke-width="2"/>
  <polygon points="370,620 390,620 380,645" fill="#F59E0B"/>

  <!-- Subtitle Tagline in Frame -->
  <rect x="60" y="800" width="460" height="50" rx="4" fill="#141312" opacity="0.85"/>
  <text x="80" y="832" fill="#EFE8DC" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">SKILLED INDIAN CRAFTSMANSHIP • RESIDENTIAL SITE</text>
</svg>
